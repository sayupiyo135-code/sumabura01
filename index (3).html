<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>ARENA ONLINE</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#090b12;
  color:#fff;
  font-family:system-ui,sans-serif;
}

main{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.panel{
  background:#171a24;
  border-radius:15px;
  padding:15px;
  margin-bottom:10px;
}

select,
input,
button{
  padding:10px;
  margin:4px;
  border-radius:8px;
  border:1px solid #555;
  background:#222735;
  color:white;
}

canvas{
  width:100%;
  border:3px solid white;
  border-radius:12px;
  display:block;
}

#touch{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:8px;
}

.touch{
  padding:18px;
  font-size:20px;
}
</style>
</head>

<body>

<main>

<div class="panel">

<h1>⚔️ ARENA ONLINE</h1>

<select id="character"></select>

<select id="stage">
<option>Sky Island</option>
<option>Battle Field</option>
<option>Small Arena</option>
</select>

<input
id="adminCode"
maxlength="4"
placeholder="管理者コード">

<button id="unlock">
👑 解放
</button>

<br>

<input
id="roomId"
placeholder="ルームID">

<button id="create">
🏠 ルーム作成
</button>

<button id="join">
🔗 参加
</button>

<button id="restart">
🔄 再戦
</button>

<div id="status">
接続中...
</div>

</div>

<canvas
id="game"
width="1100"
height="650">
</canvas>

<div id="touch">

<button class="touch"
data-a="left">
◀
</button>

<button class="touch"
data-a="jump">
▲
</button>

<button class="touch"
data-a="right">
▶
</button>

<button class="touch"
data-a="attack">
👊
</button>

<button class="touch"
data-a="special3">
⭐
</button>

</div>

<p>
PC: A / D / W / F / 1 / 2 / 3　
タブレット: 画面ボタン　
R: 再戦
</p>

</main>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const character =
document.getElementById("character");

const stage =
document.getElementById("stage");

const adminCode =
document.getElementById("adminCode");

const roomId =
document.getElementById("roomId");

const status =
document.getElementById("status");

let state = null;
let unlocked = false;

const normal = [
  ["🔥 ブレイズ","Blaze"],
  ["⚡ ストーム","Storm"],
  ["🪨 ロック","Rock"],
  ["🌑 シャドウ","Shadow"],
  ["🪽 ウィング","Wing"]
];

const admins = [
  ["👑 ネオン","Neon"],
  ["💀 デストロイヤー","Destroyer"],
  ["🌌 ゼロ","Zero"],
  ["☠️ グリッチ","Glitch"],
  ["🐉 ドラゴン","Dragon"]
];

function fillCharacters(){

  character.innerHTML = "";

  const normalGroup =
    document.createElement("optgroup");

  normalGroup.label =
    "🎭 通常キャラ";

  normal.forEach(item => {

    normalGroup.appendChild(
      new Option(
        item[0],
        item[1]
      )
    );

  });

  character.appendChild(
    normalGroup
  );

  if(unlocked){

    const adminGroup =
      document.createElement("optgroup");

    adminGroup.label =
      "👑 管理者キャラ";

    admins.forEach(item => {

      adminGroup.appendChild(
        new Option(
          item[0],
          item[1]
        )
      );

    });

    character.appendChild(
      adminGroup
    );
  }
}

fillCharacters();

document
.getElementById("unlock")
.onclick = () => {

  if(adminCode.value === "3487"){

    unlocked = true;

    fillCharacters();

    status.textContent =
      "👑 管理者キャラ解放！";

  }else{

    status.textContent =
      "⚠️ コードが違います";

  }
};

document
.getElementById("create")
.onclick = () => {

  socket.emit(
    "createRoom",
    {
      character:character.value,
      stage:stage.value,
      adminCode:adminCode.value
    }
  );

};

document
.getElementById("join")
.onclick = () => {

  socket.emit(
    "joinRoom",
    {
      id:roomId.value,
      character:character.value
    }
  );

};

document
.getElementById("restart")
.onclick = () => {

  socket.emit("restart");

};

socket.on(
  "connect",
  () => {

    status.textContent =
      "🌐 オンライン";

  }
);

socket.on(
  "roomCreated",
  data => {

    roomId.value = data.id;

    if(data.adminUnlocked){

      unlocked = true;

      fillCharacters();

    }

    status.textContent =
      "🏠 ルームID: " + data.id;

  }
);

socket.on(
  "errorMsg",
  msg => {

    status.textContent =
      "⚠️ " + msg;

  }
);

socket.on(
  "state",
  data => {

    state = data;

  }
);

const keys = {};

addEventListener(
  "keydown",
  event => {

    const key =
      event.key.toLowerCase();

    if(key === "r"){

      socket.emit("restart");

    }

    if(
      ["a","d","w","f","1","2","3"]
      .includes(key)
    ){

      keys[key] = true;

    }

  }
);

addEventListener(
  "keyup",
  event => {

    keys[
      event.key.toLowerCase()
    ] = false;

  }
);

setInterval(
  () => {

    if(keys.a)
      socket.emit(
        "input",
        {action:"left"}
      );

    if(keys.d)
      socket.emit(
        "input",
        {action:"right"}
      );

    if(keys.w)
      socket.emit(
        "input",
        {action:"jump"}
      );

    if(keys.f)
      socket.emit(
        "input",
        {action:"attack"}
      );

    if(keys["1"])
      socket.emit(
        "input",
        {action:"special1"}
      );

    if(keys["2"])
      socket.emit(
        "input",
        {action:"special2"}
      );

    if(keys["3"])
      socket.emit(
        "input",
        {action:"special3"}
      );

  },
  45
);

document
.querySelectorAll(".touch")
.forEach(button => {

  button.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      socket.emit(
        "input",
        {
          action:
            button.dataset.a
        }
      );

    }
  );

});

function draw(){

  ctx.clearRect(
    0,
    0,
    1100,
    650
  );

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      650
    );

  gradient.addColorStop(
    0,
    "#55b9ef"
  );

  gradient.addColorStop(
    1,
    "#d8f4ff"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    1100,
    650
  );

  ctx.fillStyle =
    "#6b4f35";

  ctx.fillRect(
    200,
    500,
    700,
    30
  );

  ctx.fillStyle =
    "#54a83f";

  ctx.fillRect(
    200,
    493,
    700,
    9
  );

  ctx.fillStyle =
    "#6b4f35";

  ctx.fillRect(
    380,
    390,
    340,
    22
  );

  const players =
    state?.players || [];

  players.forEach(
    player => {

      ctx.fillStyle =
        player.slot === 0
          ? "#ef4444"
          : "#3b82f6";

      ctx.fillRect(
        player.x,
        player.y,
        48,
        70
      );

      ctx.fillStyle =
        "#ffd6b0";

      ctx.beginPath();

      ctx.arc(
        player.x + 24,
        player.y + 14,
        16,
        0,
        Math.PI * 2
      );

      ctx.fill();

      if(player.invincible){

        ctx.strokeStyle =
          "white";

        ctx.lineWidth = 5;

        ctx.strokeRect(
          player.x - 5,
          player.y - 5,
          58,
          80
        );

      }

    }
  );

  ctx.fillStyle =
    "#111c";

  ctx.fillRect(
    18,
    18,
    1064,
    70
  );

  ctx.fillStyle =
    "white";

  ctx.font =
    "bold 25px system-ui";

  ctx.fillText(
    "❤️ " +
    (players[0]?.stocks ?? 3) +
    "   💯 " +
    Math.floor(
      players[0]?.damage || 0
    ) +
    "%",
    35,
    55
  );

  ctx.fillText(
    "❤️ " +
    (players[1]?.stocks ?? 3) +
    "   💯 " +
    Math.floor(
      players[1]?.damage || 0
    ) +
    "%",
    720,
    55
  );

  if(state?.phase === "result"){

    ctx.fillStyle =
      "#000b";

    ctx.fillRect(
      0,
      0,
      1100,
      650
    );

    ctx.textAlign =
      "center";

    ctx.font =
      "bold 60px system-ui";

    ctx.fillText(
      "🏆 P" +
      (state.winner + 1) +
      " WIN!",
      550,
      320
    );

    ctx.textAlign =
      "left";
  }

  requestAnimationFrame(
    draw
  );
}

draw();

</script>

</body>
</html>
